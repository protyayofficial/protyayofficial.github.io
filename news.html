---
layout: content
title: News
description: News and updates from Protyay Dey.
intro: Research, talks, visits, and milestones from my academic journey.
---

<div class="space-y-6">
  {% for item in site.data.news %}
  <article class="entry-card card-bg rounded-2xl p-6 md:p-8">
    <div class="flex flex-col md:flex-row gap-5">
      <time class="text-amber-400 font-bold text-sm md:w-24 flex-shrink-0 pt-1">{{ item.time }}</time>
      <div>
        <h2 class="text-xl font-bold text-white mb-3">{{ item.title | markdownify | strip_html }}</h2>
        <p class="text-slate-300 leading-relaxed">{{ item.highlight }}</p>
      </div>
    </div>
  </article>
  {% endfor %}
</div>
