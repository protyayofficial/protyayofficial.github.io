  news_highlight_color: 'is-info'
  personal_description: |
    I am a PhD student and Research Assistant in the Department of Computer Science and Engineering at the University at Buffalo (SUNY), working in the Computer Vision and Machine Learning (CVML) Lab under the supervision of [Dr. Vishnu Lokhande](https://vlokhande-ub.github.io). My research spans machine learning, optimization, generative AI, multi-agent systems, and computational neuroimaging. Previously, I served as a Teaching Assistant at UB.

    Prior to this, I completed my Master’s in Artificial Intelligence at the Indian Institute of Technology Ropar, where my thesis on source camera forensics was advised by [Dr. Puneet Goyal](https://sites.google.com/view/goyalpuneet). During this time, I was also privileged to collaborate with [Prof. Gaurav Sharma](https://hajim.rochester.edu/ece/sites/gsharma/) from the University of Rochester. 

    After my master’s, I continued working in source camera forensics as a Research Intern in the IPSA Lab at IIT Ropar under the supervision of [Dr. Puneet Goyal](https://sites.google.com/view/goyalpuneet). Later, I joined the CVPR Lab at IIT Ropar as a Junior Research Fellow, working with [Dr. Santosh Kumar Vipparthi](https://skvipparthi.github.io) on federated learning for aerial scene classification.
   
    I completed my B.Tech at the University of Engineering and Management Jaipur, where my undergraduate thesis on driver drowsiness detection was advised by [Mr. Dipta Mukherjee](https://www.linkedin.com/in/dipta-mukherjee-21564a21/).

  research_interest: |
    My research spans **machine learning**, **optimization**, **generative AI**, **multi-agent systems**, and **computational neuroimaging**. I am particularly interested in efficient, reliable, and structure-aware methods for reasoning and generation.

    Previously, I worked on federated learning for aerial scene understanding, with a particular interest in extreme data heterogeneity. I have also contributed to source camera forensics by developing camera model identification techniques and a large-scale dataset for the research community.
  

  
