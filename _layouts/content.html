<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - Protyay Dey</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"], serif: ["DM Serif Display", "serif"] } } },
      };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" />
    <style>
      body { background: #f5f7fb; color: #172033; overflow-x: hidden; }
      .page-glow {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 10% 12%, rgba(37,99,235,.08), transparent 30%), radial-gradient(circle at 88% 18%, rgba(14,165,233,.05), transparent 26%), linear-gradient(rgba(37,99,235,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,.025) 1px, transparent 1px); background-size: auto, auto, 32px 32px, 32px 32px;
      }
      .content-wrapper { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 58px; }
      .card-bg { background: rgba(255,255,255,.92); border: 1px solid #dfe4ec; }
      .gradient-text { background: linear-gradient(135deg,#60a5fa,#a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .gradient-accent { background: linear-gradient(90deg,#60a5fa,#a78bfa); }
      .entry-card { transition: border-color .2s ease, box-shadow .2s ease; }
      .entry-card:hover { border-color: #93b4df; box-shadow: 0 8px 24px rgba(30,64,175,.08); }
      [class*="text-teal-"] { color: #60a5fa !important; }
      [class*="text-amber-"] { color: #a78bfa !important; }
      [class*="border-teal-"] { border-color: rgba(96,165,250,.24) !important; }
      [class*="bg-teal-400/"] { background-color: rgba(96,165,250,.1) !important; }
      .text-white { color: #172033 !important; }
      .text-slate-300 { color: #475569 !important; }
      .text-slate-400, .text-slate-500 { color: #64748b !important; }
      [class*="gradient"] .text-white { color: #ffffff !important; }
    </style>
  </head>
  <body class="font-sans">
    <div class="page-glow"></div>
    <div class="content-wrapper">
      {% include nav.html %}
      <main class="max-w-6xl mx-auto px-6 py-5 lg:py-6">
        <header class="mb-5 border-b border-slate-200 pb-4 relative">
          <span class="absolute -left-4 top-1 h-9 w-1 rounded-full bg-blue-600"></span>
          <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-2">
            <h1 class="text-3xl md:text-4xl font-bold text-white font-serif">{{ page.title }}</h1>
            {% if page.intro %}<p class="text-slate-500 text-sm max-w-2xl md:text-right">{{ page.intro }}</p>{% endif %}
          </div>
        </header>
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
  </body>
</html>
