<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - Protyay Dey</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { fontFamily: { sans: ["DM Sans", "system-ui", "sans-serif"], serif: ["DM Serif Display", "serif"] } } },
      };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body { background: #0a0f1e; color: #e8eaf6; }
      .page-glow {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 15% 10%, rgba(20,184,166,.12), transparent 35%), radial-gradient(circle at 85% 25%, rgba(234,179,8,.08), transparent 30%);
      }
      .content-wrapper { position: relative; z-index: 1; min-height: 100vh; }
      .card-bg { background: rgba(15,23,42,.68); backdrop-filter: blur(15px); border: 1px solid rgba(20,184,166,.18); }
      .gradient-text { background: linear-gradient(135deg,#14b8a6,#eab308); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .gradient-accent { background: linear-gradient(90deg,#14b8a6,#eab308); }
      .entry-card { transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
      .entry-card:hover { transform: translateY(-4px); border-color: rgba(20,184,166,.5); box-shadow: 0 18px 40px rgba(2,6,23,.45); }
    </style>
  </head>
  <body class="font-sans">
    <div class="page-glow"></div>
    <div class="content-wrapper">
      {% include nav.html %}
      <main class="max-w-5xl mx-auto px-6 py-14 lg:py-20">
        <header class="mb-14 text-center">
          <p class="text-teal-400 uppercase tracking-[0.28em] text-xs font-bold mb-4">Protyay Dey</p>
          <h1 class="text-4xl md:text-6xl font-bold text-white font-serif mb-5">{{ page.title }}</h1>
          <div class="w-28 h-1.5 gradient-accent mx-auto rounded-full"></div>
          {% if page.intro %}<p class="text-slate-400 mt-6 text-lg max-w-2xl mx-auto">{{ page.intro }}</p>{% endif %}
        </header>
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
  </body>
</html>
